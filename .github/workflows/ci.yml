name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    # ubuntu, pas windows : les services de conteneurs GitHub Actions (Postgres
    # ci-dessous) ne sont disponibles que sur les runners Linux. Le build de
    # l'installeur .exe Windows sera un job séparé (électron-builder), ajouté
    # quand une première version livrable existera (voir docs/ROADMAP.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isac_erp
          POSTGRES_PASSWORD: isac_erp_dev
          POSTGRES_DB: isac_erp
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://isac_erp:isac_erp_dev@localhost:5432/isac_erp?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @isac-erp/db prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test
