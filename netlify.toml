[build]
  # Le package deploye est le portail Next.js. Netlify detecte ainsi son
  # framework et active automatiquement son runtime Next.js.
  base = "apps/web-portail"
  # Le portail depend des packages du monorepo, dont les artefacts ne sont pas
  # versionnes dans Git. Ils doivent etre construits avant Next.js.
  command = "cd ../.. && pnpm --filter @isac-erp/shared build && pnpm --filter @isac-erp/db prisma:generate && pnpm --filter @isac-erp/db build && pnpm --filter @isac-erp/api build && pnpm --filter @isac-erp/web-portail build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
