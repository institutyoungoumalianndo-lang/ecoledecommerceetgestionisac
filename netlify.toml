[build]
  # Le portail depend des packages du monorepo, dont les artefacts ne sont pas
  # versionnes dans Git. Ils doivent etre construits avant Next.js.
  command = "pnpm --filter @isac-erp/shared build && pnpm --filter @isac-erp/db prisma:generate && pnpm --filter @isac-erp/db build && pnpm --filter @isac-erp/api build && pnpm --filter @isac-erp/web-portail build"
  publish = "apps/web-portail/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_PORTAL_API_URL = "https://blvd-quebec-qualify-responsible.trycloudflare.com/trpc"

# Force le runtime officiel Netlify/Next.js : les routes dynamiques du portail
# restent ainsi disponibles au lieu d'etre traitees comme de simples fichiers.
[[plugins]]
  package = "@netlify/plugin-nextjs"
